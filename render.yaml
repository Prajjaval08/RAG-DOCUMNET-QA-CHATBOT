# Render deployment for the RAG Document Q&A Chatbot (see docs/deploy.md).
# Secrets (OPENAI_API_KEY etc.) are NOT in this file: set them in the
# Render dashboard under Environment, after the service is created.
# The free tier sleeps when idle and its disk is ephemeral, so the
# FAISS index resets on restart — visitors re-upload and re-index docs.
services:
  - type: web
    name: rag-document-qa-chatbot
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: CHUNK_SIZE
        value: "1000"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: RETRIEVAL_TOP_K
        value: "4"
