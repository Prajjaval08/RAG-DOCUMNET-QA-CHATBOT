name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install "ruff>=0.8,<1.0"
      - name: Lint
        run: ruff check .
      - name: Import checks
        run: |
          PYTHONPATH=src python -c "import rag_chatbot.config, rag_chatbot.loaders, rag_chatbot.chunking, rag_chatbot.embeddings, rag_chatbot.vector_store, rag_chatbot.llm, rag_chatbot.rag; print('imports ok')"
      - name: Tests (no paid APIs, no model weights)
        run: PYTHONPATH=src pytest -q
